<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShoppingCart Login Tester</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #17202a;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px;
        }

        main {
            width: min(720px, 100%);
            background: #ffffff;
            border: 1px solid #d8dee6;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 12px 30px rgba(23, 32, 42, 0.08);
        }

        h1 {
            margin: 0 0 20px;
            font-size: 24px;
        }

        label {
            display: grid;
            gap: 6px;
            margin-bottom: 14px;
            font-weight: 700;
        }

        input {
            border: 1px solid #c7d0db;
            border-radius: 6px;
            font: inherit;
            padding: 10px 12px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 18px 0;
        }

        button {
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            padding: 10px 14px;
            background: #1769aa;
            color: #ffffff;
        }

        button.secondary {
            background: #eef2f6;
            color: #17202a;
        }

        button.danger {
            background: #b42318;
        }

        .status {
            border-radius: 6px;
            padding: 10px 12px;
            background: #eef2f6;
            margin-bottom: 14px;
        }

        pre {
            min-height: 160px;
            overflow: auto;
            background: #111827;
            color: #e5e7eb;
            border-radius: 6px;
            padding: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
<main>
    <h1>ShoppingCart Login Tester</h1>
    <div class="status">Tester version: localStorage token storage</div>

    <label>
        API URL
        <input id="apiUrl" value="http://localhost:8080">
    </label>

    <label>
        First Name
        <input id="firstName" value="Jane">
    </label>

    <label>
        Last Name
        <input id="lastName" value="Smith">
    </label>

    <label>
        Email
        <input id="email" type="email" value="buyer@example.com">
    </label>

    <label>
        Password
        <input id="password" type="password" value="password-123">
    </label>

    <label>
        Phone
        <input id="phone" value="+351 912 345 678">
    </label>

    <label>
        Address Line 1
        <input id="addressLine1" value="Street and house number">
    </label>

    <label>
        Town or City
        <input id="townOrCity" value="Lisbon">
    </label>

    <label>
        Postcode
        <input id="postcode" value="1000-001">
    </label>

    <label>
        Country
        <input id="country" value="Portugal">
    </label>

    <div class="actions">
        <button id="registerButton" class="secondary">Register</button>
        <button id="loginButton">Login</button>
        <button id="statusButton" class="secondary">Check Auth</button>
        <button id="logoutButton" class="danger">Clear Token</button>
    </div>

    <div id="tokenStatus" class="status"></div>
    <pre id="output"></pre>
</main>

<script>
    const tokenStorageKey = "shopping_cart_token";
    const apiUrlInput = document.querySelector("#apiUrl");
    const firstNameInput = document.querySelector("#firstName");
    const lastNameInput = document.querySelector("#lastName");
    const emailInput = document.querySelector("#email");
    const passwordInput = document.querySelector("#password");
    const phoneInput = document.querySelector("#phone");
    const addressLine1Input = document.querySelector("#addressLine1");
    const townOrCityInput = document.querySelector("#townOrCity");
    const postcodeInput = document.querySelector("#postcode");
    const countryInput = document.querySelector("#country");
    const tokenStatus = document.querySelector("#tokenStatus");
    const output = document.querySelector("#output");

    document.querySelector("#registerButton").addEventListener("click", register);
    document.querySelector("#loginButton").addEventListener("click", login);
    document.querySelector("#statusButton").addEventListener("click", checkAuth);
    document.querySelector("#logoutButton").addEventListener("click", clearToken);

    renderTokenStatus();
    writeOutput("Ready.");

    async function register() {
        const response = await fetch(`${apiUrl()}/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                firstName: firstNameInput.value,
                lastName: lastNameInput.value,
                email: emailInput.value,
                password: passwordInput.value,
                phone: phoneInput.value,
                customerType: "private_customer",
                deliveryAddress: {
                    addressLine1: addressLine1Input.value,
                    townOrCity: townOrCityInput.value,
                    postcode: postcodeInput.value,
                    country: countryInput.value
                },
                sameAsDeliveryAddress: true
            })
        });
        const body = await response.json();

        writeOutput({ status: response.status, body });
    }

    async function login() {
        const response = await fetch(`${apiUrl()}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: emailInput.value,
                password: passwordInput.value
            })
        });
        const body = await response.json();

        if (response.ok && body.token) {
            setToken(body.token);
        }

        renderTokenStatus();
        writeOutput({ status: response.status, body });
    }

    async function checkAuth() {
        const token = getToken();
        const response = await fetch(`${apiUrl()}/auth/status`, {
            method: "GET",
            headers: token ? { "Authorization": `Bearer ${token}` } : {}
        });
        const body = await response.json();

        writeOutput({ status: response.status, body });
    }

    function clearToken() {
        localStorage.removeItem(tokenStorageKey);
        renderTokenStatus();
        writeOutput("Token cleared.");
    }

    function apiUrl() {
        return apiUrlInput.value.replace(/\/$/, "");
    }

    function setToken(token) {
        localStorage.setItem(tokenStorageKey, token);
    }

    function getToken() {
        return localStorage.getItem(tokenStorageKey);
    }

    function renderTokenStatus() {
        const token = getToken();
        tokenStatus.textContent = token ? `Token saved: ${token}` : "No token saved.";
    }

    function writeOutput(value) {
        output.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
    }
</script>
</body>
</html>
